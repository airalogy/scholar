name: Bug report
description: Report a reproducible Scholar defect without sensitive deployment data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include tokens, passwords, personal data, private URLs, or unpublished institution data.
  - type: input
    id: version
    attributes:
      label: Scholar version
      description: Copy version and commit from GET /version.
      placeholder: 3.0.0 / abcdef123456
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Public multi-institution
        - Private single-institution
        - Local development
        - Modified fork
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Include only the relevant lines after removing all sensitive values.
      render: shell
