name: Feature request
description: Propose a generic Scholar capability or deployment improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the generic user or operator problem, not confidential institution requirements.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: deployment
    attributes:
      label: Deployment and data impact
      description: Note authentication, migration, storage, API compatibility, or offline deployment implications.
