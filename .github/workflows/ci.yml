name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate CI toolchain configuration
        run: node scripts/check-ci-config.mjs
      - name: Validate deployment scripts
        run: sh -n deploy/scholarctl deploy/export-images.sh deploy/import-images.sh
      - name: Validate bundled database Compose configuration
        env:
          SCHOLAR_RUNTIME_ENV_FILE: ${{ github.workspace }}/deploy/.env.example
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml -f deploy/compose.database.yaml config --quiet
      - name: Validate external database Compose configuration
        env:
          SCHOLAR_RUNTIME_ENV_FILE: ${{ github.workspace }}/deploy/.env.example
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml config --quiet
      - name: Validate custom Docker network Compose configuration
        env:
          SCHOLAR_RUNTIME_ENV_FILE: ${{ github.workspace }}/deploy/.env.example
          SCHOLAR_DOCKER_SUBNET: 172.30.255.0/28
          SCHOLAR_DOCKER_GATEWAY: 172.30.255.1
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yaml -f deploy/compose.database.yaml -f deploy/compose.network.yaml config --quiet

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airalogy_scholar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airalogy_scholar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airalogy_scholar_test?schema=public
      RELEASE_SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airalogy_scholar_test?schema=release_source

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm license:check
      - run: pnpm version:check
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:audit:integrity
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @airalogy/scholar-server smoke:dist
      - run: pnpm release:source:verify

  container-build:
    needs:
      - deployment-config
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: airalogy/scholar-${{ matrix.component }}:ci
          build-args: |
            APP_VERSION=3.0.0
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}
