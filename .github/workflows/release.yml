name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airalogy_scholar_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airalogy_scholar_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airalogy_scholar_release?schema=public
      RELEASE_SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airalogy_scholar_release?schema=release_source
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:audit:integrity
      - run: pnpm license:check
      - run: pnpm check
      - run: pnpm release:source:verify
      - run: pnpm release:check -- "$RELEASE_TAG"

  images:
    needs: verify
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scholar-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/scholar-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image identity
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/scholar-${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-metadata
          printf '%s\n' "$IMAGE_REPOSITORY" > "image-metadata/$COMPONENT.repository"
          printf '%s\n' "$IMAGE_DIGEST" > "image-metadata/$COMPONENT.digest"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scholar-${{ matrix.component }}-image-metadata
          path: image-metadata
          if-no-files-found: error

  release:
    needs: images
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scholar-*-image-metadata
          path: image-metadata
          merge-multiple: true
      - name: Assemble immutable Scholar release
        run: |
          mkdir -p release-stage/docs
          cp -R deploy release-stage/deploy
          cp README.md release-stage/README.md
          cp README.zh-CN.md release-stage/README.zh-CN.md
          cp docs/private-deployment.md release-stage/docs/private-deployment.md
          cp LICENSE NOTICE TRADEMARKS.md ASSETS.md SECURITY.md CHANGELOG.md CHANGELOG.zh-CN.md VERSION release-stage/
          node scripts/create-release-metadata.mjs \
            --metadata-directory image-metadata \
            --output-directory release-stage/deploy \
            --env-template deploy/.env.example \
            --release-tag "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA"
      - name: Smoke test the exact released component set
        run: |
          smoke_env=$PWD/release-stage/deploy/.env
          smoke_project=scholar-release-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          database_password=$(openssl rand -hex 24)
          jwt_secret=$(openssl rand -hex 32)
          cp release-stage/deploy/.env.example "$smoke_env"
          sed -i \
            -e "s/^SCHOLAR_COMPOSE_PROJECT_NAME=.*/SCHOLAR_COMPOSE_PROJECT_NAME=$smoke_project/" \
            -e 's/^SCHOLAR_HTTP_PORT=.*/SCHOLAR_HTTP_PORT=18080/' \
            -e 's|^SCHOLAR_DOCKER_SUBNET=.*|SCHOLAR_DOCKER_SUBNET=172.30.255.0/28|' \
            -e 's|^SCHOLAR_DOCKER_GATEWAY=.*|SCHOLAR_DOCKER_GATEWAY=172.30.255.1|' \
            -e 's|^SCHOLAR_RESERVED_SUBNETS=.*|SCHOLAR_RESERVED_SUBNETS=10.0.0.0/8,192.168.0.0/16|' \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$database_password/" \
            -e "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://scholar:$database_password@postgres:5432/scholar?schema=public|" \
            -e "s/^JWT_SECRET=.*/JWT_SECRET=$jwt_secret/" \
            -e 's/^PRIVATE_INSTITUTION_SLUG=.*/PRIVATE_INSTITUTION_SLUG=release-smoke/' \
            -e 's|^OPENAI_BASE_URL=.*|OPENAI_BASE_URL=https://models.example.invalid/v1|' \
            -e 's/^OPENAI_API_KEY=.*/OPENAI_API_KEY=release-smoke-model-key/' \
            -e "s|^SCHOLAR_STATE_DIR=.*|SCHOLAR_STATE_DIR=$RUNNER_TEMP/$smoke_project-state|" \
            "$smoke_env"
          cleanup() {
            SCHOLAR_RUNTIME_ENV_FILE="$smoke_env" docker compose \
              --project-name "$smoke_project" \
              --env-file "$smoke_env" \
              -f release-stage/deploy/compose.yaml \
              -f release-stage/deploy/compose.database.yaml \
              -f release-stage/deploy/compose.network.yaml \
              down --volumes --remove-orphans
          }
          trap cleanup EXIT
          SCHOLAR_ENV_FILE="$smoke_env" release-stage/deploy/scholarctl install
          curl --fail --silent --show-error http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error http://127.0.0.1:18080/api/version
          curl --fail --location --silent --show-error --output /dev/null http://127.0.0.1:18080/docs/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/docs/zh/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/docs/en/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/api/docs/json
          cleanup
          trap - EXIT
          rm -f "$smoke_env"
      - name: Package deployment files
        run: |
          tar -czf "scholar-deploy-${GITHUB_REF_NAME}.tar.gz" -C release-stage .
          sha256sum "scholar-deploy-${GITHUB_REF_NAME}.tar.gz" > "scholar-deploy-${GITHUB_REF_NAME}.tar.gz.sha256"
          cp release-stage/deploy/release-manifest.json "scholar-release-${GITHUB_REF_NAME}.json"
          cp release-stage/deploy/release-manifest.env "scholar-release-${GITHUB_REF_NAME}.env"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: scholar-deploy-${{ github.ref_name }}.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "scholar-deploy-${GITHUB_REF_NAME}.tar.gz" "scholar-deploy-${GITHUB_REF_NAME}.tar.gz.sha256" "scholar-release-${GITHUB_REF_NAME}.json" "scholar-release-${GITHUB_REF_NAME}.env" --generate-notes --verify-tag
